name: A1 Mobi CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: a1mobi
          POSTGRES_USER: a1mobi
          POSTGRES_PASSWORD: a1mobi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U a1mobi -d a1mobi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://a1mobi:a1mobi_ci@127.0.0.1:5432/a1mobi?schema=public
      APP_ORIGIN: http://127.0.0.1:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:sql-bom
      - run: npx prisma migrate deploy
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Build immutable Node 24 Linux release candidate bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s .next/BUILD_ID
          test -f package-lock.json
          mkdir -p artifacts/deploy artifacts/release
          cp -a .next artifacts/deploy/.next
          if test -d public; then cp -a public artifacts/deploy/public; fi
          if test -d prisma; then cp -a prisma artifacts/deploy/prisma; fi
          cp package.json package-lock.json next.config.ts artifacts/deploy/
          sha=$(printf '%s' "$GITHUB_SHA" | cut -c1-12)
          bundle="artifacts/release/a1-mobi-linux-node24-rc-${sha}.tar.gz"
          tar -czf "$bundle" -C artifacts/deploy .
          test -s "$bundle"
          tar -tzf "$bundle" | grep -F './.next/BUILD_ID' > /dev/null
          sha256sum "$bundle" > artifacts/release/SHA256SUMS.txt
          {
            echo "a1-mobi — release candidate bundle (NOT production approved)"
            echo "Canonical commit: $GITHUB_SHA"
            echo "Build node: $(node --version)"
            echo 'Target: Linux + Node.js 24, package-lock exact npm ci, and configured external PostgreSQL.'
            echo 'Environment secrets and .env files deliberately excluded.'
            echo 'Deploy requires separate authorization, tenant-safe DB migration, and real E2E operational signoff.'
          } > artifacts/release/DEPLOYMENT-GATE.txt
      - name: Generate release SBOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release
          npm sbom --sbom-format cyclonedx > artifacts/release/sbom.cdx.json
          {
            echo "A1 Mobi Release Evidence"
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo "Node: $(node --version)"
            echo "Generated after migrations, validation, lint, typecheck, tests, runtime audit and production build."
          } > artifacts/release/EVIDENCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: a1-mobi-release-evidence-${{ github.sha }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 30
