name: A1 Mobi Pilot Visual Evidence

on:
  push:
    branches:
      - feat/pilot-demo-experience-20261005
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://a1mobi:a1mobi_ci@127.0.0.1:5432/a1mobi?schema=public
      APP_ORIGIN: http://127.0.0.1:3185
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: a1mobi
          POSTGRES_USER: a1mobi
          POSTGRES_PASSWORD: a1mobi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U a1mobi -d a1mobi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run build

      - name: Capture desktop and mobile pilot screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pilot
          NODE_ENV=production npm run start -- --hostname 127.0.0.1 --port 3185 >/tmp/a1-mobi-pilot.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3185/ar >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3185/ar >/dev/null

          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            echo "Chromium/Chrome not available on runner"
            exit 1
          fi

          capture() {
            local name="$1"
            local size="$2"
            local url="$3"
            "$browser" --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size="$size" \
              --screenshot="artifacts/pilot/$name.png" \
              "$url"
            test -s "artifacts/pilot/$name.png"
          }

          capture ar-dashboard-desktop 1440,1000 http://127.0.0.1:3185/ar
          capture ar-admin-desktop 1440,1100 http://127.0.0.1:3185/ar/admin
          capture ar-products-desktop 1440,1200 http://127.0.0.1:3185/ar/products
          capture ar-pos-desktop 1440,1100 http://127.0.0.1:3185/ar/pos
          capture en-dashboard-desktop 1440,1000 http://127.0.0.1:3185/en
          capture ar-dashboard-mobile 390,844 http://127.0.0.1:3185/ar
          capture ar-products-mobile 390,844 http://127.0.0.1:3185/ar/products

          {
            echo "A1 Mobi Pilot Visual Evidence"
            echo "Commit: $GITHUB_SHA"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Generated by GitHub Actions from the built application."
            echo "Scope: visual Pilot Demo only; not Production/Public Release evidence."
          } > artifacts/pilot/EVIDENCE.txt

      - uses: actions/upload-artifact@v4
        with:
          name: a1-mobi-pilot-visuals-${{ github.sha }}
          path: artifacts/pilot
          if-no-files-found: error
          retention-days: 14
