services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: a1mobi
      POSTGRES_USER: a1mobi
      POSTGRES_PASSWORD: a1mobi_dev
    ports:
      - "5437:5432"
    volumes:
      - a1_mobi_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a1mobi -d a1mobi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  a1_mobi_postgres: